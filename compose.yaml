# Single-instance pilot deployment. SQLite requires exactly ONE replica — never scale this service horizontally.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    # Only reachable from this server; Caddy is the public entry point.
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  caddy:
    # Automatic HTTPS (Let's Encrypt). Host networking avoids Docker port-forwarding/firewall conflicts:
    # Caddy binds 80/443 directly, so the host firewall (ufw) rules apply as written.
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  caddy_data:
